name = "esteira"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# O token da loja nunca é gravado aqui: ele é repassado por POST para o
# aplicativo na máquina do cliente. Por isso não há KV, D1 nem nada de
# armazenamento neste worker — e é de propósito.

[vars]
BASE_URL = "https://esteira.cloud"
SHOPIFY_CLIENT_ID = "d278ab9bc83df201d73436fb29b70f9d"   # público, não é segredo
# Lojas com app próprio (distribuição personalizada) — ver lib/apps.js.
# Ex.: '{"loja.myshopify.com": "CHOMPS"}' + SHOPIFY_CLIENT_ID_CHOMPS aqui
# + SHOPIFY_CLIENT_SECRET_CHOMPS como secret.
SHOPIFY_LOJAS = '{"loja-sparta-store.myshopify.com": "SPARTA"}'
# App "Esteira Sparta", organização Cbx Media, distribuição personalizada
# para a loja acima (não dá para trocar). O segredo: wrangler secret put
# SHOPIFY_CLIENT_SECRET_SPARTA
SHOPIFY_CLIENT_ID_SPARTA = "69d26574b2edf370f54462055c141d67"
# SHOPIFY_CLIENT_ID entra como var pelo painel ou por `wrangler secret`
# SHOPIFY_CLIENT_SECRET entra SÓ como secret: é com ele que o HMAC é
# conferido, e com ele vazado qualquer um forja um retorno da Shopify.

[[routes]]
pattern = "esteira.cloud/*"
zone_name = "esteira.cloud"
